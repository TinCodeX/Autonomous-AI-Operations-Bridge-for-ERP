name: Odoo MCP Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: myodoo_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      odoo:
        image: odoo:18.0
        env:
          HOST: db
          USER: odoo
          PASSWORD: myodoo_password
        ports:
          - 8069:8069

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r odoo-mcp-server/requirements.txt

      - name: Code Quality & Syntax Check (Flake8)
        run: |
          flake8 odoo-mcp-server --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 odoo-mcp-server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Test Suite
        env:
          ODOO_URL: http://localhost:8069
          ODOO_DB: odoo
          ODOO_USER: admin
          ODOO_PASSWORD: admin
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          cd odoo-mcp-server
          pytest

  deploy:
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Cloud Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/odoo-ai-workspace
            git pull origin main
            docker compose restart web
            systemctl --user restart odoo-telegram-bot
